<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMPDocs - Administration</title>
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

    <!-- Barre de navigation -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html">📚 UMPDocs</a>
        </div>
        <nav class="nav-links">
            <a href="index.html">Accueil</a>
            <a href="admin.html" class="active">Espace Admin</a>
        </nav>
    </header>

    <!-- Conteneur Principal -->
    <main class="main-container">
        
        <section class="form-container">
            <h2>Ajouter un nouveau document</h2>
            <p>Remplissez les informations ci-dessous pour mettre en ligne un nouveau cours.</p>
            
            <form id="uploadForm">
               <label for="title">Titre du document :</label>
<input type="text" id="title" required placeholder="Ex: Résumé Algèbre 1">

<div style="margin-bottom: 15px; margin-top: 15px;">
    <label for="filiereAdmin">Filière :</label>
    <select id="filiereAdmin" name="filiere" required style="padding: 8px; width: 100%;">
    <option value="">-- Choisissez une filière --</option>
    <option value="MIP Math">MIP Math</option>
    <option value="MIP Informatique">MIP Informatique</option>
    <option value="TC Informatiques Appliquées">TC Informatiques Appliquées</option>
    <option value="Licence de Physique PC-P">Licence de Physique PC-P</option>
    <option value="Licence de Chimie PC-C">Licence de Chimie PC-C</option>
    <option value="EGC">EGC</option> <!-- 👈 La nouvelle filière est ici -->
</select>
</div>

<div style="margin-bottom: 15px;">
    <label for="semestreAdmin">Semestre :</label>
    <select id="semestreAdmin" name="semestre" required style="padding: 8px; width: 100%;">
        <option value="">-- Choisissez un semestre --</option>
        <option value="S1">S1</option>
        <option value="S2">S2</option>
        <option value="S3">S3</option>
        <option value="S4">S4</option>
        <option value="S5">S5</option>
        <option value="S6">S6</option>
    </select>
</div>

<!-- LE NOUVEAU MENU MODULE INTELLIGENT -->
<div style="margin-bottom: 15px;">
    <label for="module">Module ou Matière :</label>
    <select id="module" name="module" required style="padding: 8px; width: 100%;">
        <option value="">-- Sélectionnez d'abord une filière et un semestre --</option>
    </select>
</div>

<label for="file">Fichier (PDF uniquement) :</label>
<input type="file" id="file" accept=".pdf" required>
                <button type="submit" class="btn-primary">Mettre en ligne</button>
                <div id="uploadStatus"></div>
            </form>
            <hr style="margin: 40px 0; border: 1px solid #ddd;">

<h2>Gérer les documents existants 🗑️</h2>
<!-- C'est ici que les documents vont s'afficher -->
<div id="admin-documents-list">
    <p style="color: gray;">Chargement des documents en cours...</p>
</div>
            
            <!-- Zone d'affichage des messages de succès ou d'erreur -->
            <div id="uploadStatus"></div>
        </section>

    </main>

    <!-- Pied de page -->
    <footer>
        <p>&copy; 2026 UMPDocs - Tous droits réservés</p>
    </footer>

    <script src="assets/js/admin.js?v=2"></script>
</body>
</html>
