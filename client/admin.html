<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMPDocs - Administration</title>
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

    <!-- Barre de navigation -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html">📚 UMPDocs</a>
        </div>
        <nav class="nav-links">
            <a href="index.html">Accueil</a>
            <a href="admin.html" class="active">Espace Admin</a>
        </nav>
    </header>

    <!-- Conteneur Principal -->
    <main class="main-container">
        
        <section class="form-container">
            <h2>Ajouter un nouveau document</h2>
            <p>Remplissez les informations ci-dessous pour mettre en ligne un nouveau cours.</p>
            
            <form id="uploadForm">
                <label for="title">Titre du document :</label>
                <input type="text" id="title" required placeholder="Ex: Résumé Algèbre 1">

                <label for="module">Module ou Matière :</label>
                <input type="text" id="module" required placeholder="Ex: Mathématiques">

                <label for="file">Fichier (PDF uniquement) :</label>
                <input type="file" id="file" accept=".pdf" required>
                <div style="margin-bottom: 15px;">
    <label for="filiereAdmin">Filière :</label>
    <select id="filiereAdmin" name="filiere" required style="padding: 8px; width: 100%;">
        <option value="SMA">SMA</option>
        <option value="SMI">SMI</option>
        <option value="SMP">SMP</option>
        <option value="SMC">SMC</option>
        <option value="IA">IA</option>
        <option value="BCG">BCG</option>
        <option value="Général">Général</option>
    </select>
</div>

<div style="margin-bottom: 15px;">
    <label for="semestreAdmin">Semestre :</label>
    <select id="semestreAdmin" name="semestre" required style="padding: 8px; width: 100%;">
        <option value="S1">S1</option>
        <option value="S2">S2</option>
        <option value="S3">S3</option>
        <option value="S4">S4</option>
        <option value="S5">S5</option>
        <option value="S6">S6</option>
    </select>
</div>
                <button type="submit" class="btn-primary">Mettre en ligne</button>
                <div id="uploadStatus"></div>
            </form>
            
            <!-- Zone d'affichage des messages de succès ou d'erreur -->
            <div id="uploadStatus"></div>
        </section>

    </main>

    <!-- Pied de page -->
    <footer>
        <p>&copy; 2026 UMPDocs - Tous droits réservés</p>
    </footer>

    <script src="assets/js/admin.js?v=2"></script>
</body>
</html>
