<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMPDocs - Administration</title>
    <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
    <header>
        <div class="logo">⚙️ UMPDocs - Espace Admin</div>
        <nav>
            <a href="/" style="color: white; text-decoration: none;">Retour au site</a>
        </nav>
    </header>

    <main>
        <section style="max-width: 600px; margin: 2rem auto; padding: 2rem; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <h2>Ajouter un document PDF</h2>
            
            <form id="upload-form" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">
                
                <label for="title">Titre du document :</label>
                <input type="text" id="title" required placeholder="Ex: Cours d'Algèbre 1">

                <label for="category">Catégorie :</label>
                <select id="category" required>
                    <option value="Cours">Cours</option>
                    <option value="TD">TD</option>
                    <option value="TP">TP</option>
                    <option value="Examen">Examen</option>
                </select>

                <label for="module">Module :</label>
                <input type="text" id="module" required placeholder="Ex: Mathématiques">

                <!-- Filières mises à jour -->
                <label for="filiere">Filière :</label>
                <select id="filiere" required>
                    <option value="MIP-Info">MIP-Info</option>
                    <option value="MIP-Math">MIP-Math</option>
                    <option value="PC-P">PC-P</option>
                    <option value="PC-C">PC-C</option>
                    <option value="IA">IA (Intelligence Artificielle)</option>
                </select>

                <!-- Semestres -->
                <label for="semestre">Semestre :</label>
                <select id="semestre" required>
                    <option value="Semestre 1">Semestre 1</option>
                    <option value="Semestre 2">Semestre 2</option>
                    <option value="Semestre 3">Semestre 3</option>
                    <option value="Semestre 4">Semestre 4</option>
                    <option value="Semestre 5">Semestre 5</option>
                    <option value="Semestre 6">Semestre 6</option>
                </select>

                <!-- Option spécifique pour PC-P S6 (Cachée par défaut) -->
                <div id="option-container" style="display: none; flex-direction: column; gap: 0.5rem; background: #f0f4f8; padding: 10px; border-radius: 6px;">
                    <label for="option-pcp" style="font-weight: bold; color: #0056b3;">Option (uniquement pour PC-P - S6) :</label>
                    <select id="option-pcp">
                        <option value="">-- Aucune option --</option>
                        <option value="Electronique et systèmes embarquées">Electronique et systèmes embarquées</option>
                        <option value="Mécanique et énergetique">Mécanique et énergetique</option>
                        <option value="Energies renouvlables">Energies renouvlables</option>
                        <option value="Radiophysique">Radiophysique</option>
                    </select>
                </div>

                <label for="file">Fichier PDF :</label>
                <input type="file" id="file" accept=".pdf" required>

                <button type="submit" style="margin-top: 1rem; background-color: #0056b3; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem;">
                    Envoyer le document
                </button>
            </form>
            
            <div id="message" style="margin-top: 1rem; font-weight: bold; text-align: center;"></div>
        </section>

        <section style="max-width: 600px; margin: 2rem auto; padding: 2rem; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <!-- NOUVELLE SECTION : REQUÊTES DES ÉTUDIANTS -->
        <div style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; border-left: 5px solid #0056b3;">
            <h2 style="margin-top: 0; color: #0056b3;">📥 Requêtes des étudiants</h2>
            <div id="admin-requests-list">
                <p>Chargement des requêtes...</p>
            </div>
        </div>
            <h2>Gérer les documents existants</h2>
            <div id="admin-documents-list" style="margin-top: 1rem; display: flex; flex-direction: column; gap: 10px;">
                <p>Chargement des documents...</p>
            </div>
        </section>
    </main>

    <script src="/assets/js/admin.js"></script>
</body>
</html>
