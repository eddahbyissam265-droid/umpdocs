<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- BALISE VITALE POUR LE RESPONSIVE MOBILE -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSdocs - Les cours de la Faculté</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <!-- Barre de navigation -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html">📚 UMPDocs</a>
        </div>
        <nav class="nav-links">
            <a href="index.html" class="active">Accueil</a>
            <a href="admin.html">Espace Admin</a>
        </nav>
        <div id="zoneUtilisateur" style="text-align: right; margin-bottom: 20px;">
    <!-- Le moteur de connexion Google -->
    <div id="g_id_onload"
         data-client_id="265258547962-3l1s0l3ep99tg6ej2bk1ovgc78962euc.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleGoogleLogin"
         data-auto_prompt="false">
    </div>
    
    <!-- L'affichage visuel du bouton -->
    <div class="g_id_signin"
         data-type="standard"
         data-shape="rectangular"
         data-theme="outline"
         data-text="signin_with"
         data-size="large"
         data-logo_alignment="left">
    </div>
</div>
    </header>

    <!-- Conteneur Principal -->
    <main class="main-container">

        <!-- Section Titre et Recherche -->
        <section class="hero-section">
            <h1>Bienvenue sur FSdocs</h1>
            <p>Accédez facilement à vos cours, TD et examens récents.</p>
            
            <!-- Barre de Recherche -->
            
        </section>

        <!-- Section Grille de Documents -->
        <section class="documents-section">
            <h2>Documents Disponibles</h2>
            <!-- ZONE DE RECHERCHE ET FILTRES -->
<div class="recherche-container" style="margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
    
    <!-- L'UNIQUE barre de recherche -->
    <input type="text" id="barreRecherche" placeholder="🔍 Chercher un module, un titre..." style="padding: 8px; flex: 1; min-width: 200px; border-radius: 5px; border: 1px solid #ccc;">
    
    <!-- Filtre Filière -->
    <select id="filtreFiliere" style="padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
        <option value="">Toutes les filières</option>
        <option value="MIP Math">MIP Math</option>
        <option value="MIP Informatique">MIP Informatique</option>
        <option value="TC Informatiques Appliquées">TC Informatiques Appliquées</option>
        <option value="Licence de Physique PC-P">Licence de Physique PC-P</option>
        <option value="Licence de Chimie PC-C">Licence de Chimie PC-C</option>
        <option value="EGC">EGC</option>
    </select>

    <!-- Filtre Semestre -->
    <select id="filtreSemestre" style="padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
        <option value="">Tous les semestres</option>
        <option value="S1">S1</option>
        <option value="S2">S2</option>
        <option value="S3">S3</option>
        <option value="S4">S4</option>
        <option value="S5">S5</option>
        <option value="S6">S6</option>
    </select>

    <!-- Filtre Module intelligent -->
    <select id="filtreModule" style="padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
        <option value="">Tous les modules</option>
    </select>

    <!-- Filtre Catégorie (CELUI QUE J'AVAIS OUBLIÉ ! 😅) -->
    <select id="filtreCategorie" style="padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
        <option value="">Toutes les catégories</option>
        <option value="Cours">Cours</option>
        <option value="TD">TD / Exercices</option>
        <option value="Examens">Examens / Contrôles</option>
        <option value="Résumé">Résumé</option>
    </select>
    
</div>
            <div id="documents-container" class="documents-grid">
                <!-- Les cartes de documents seront ajoutées dynamiquement ici par main.js -->
            </div>
        </section>

    </main>

    <!-- Pied de page -->
    <footer>
        <p>&copy; 2026 FSdocs - Tous droits réservés</p>
    </footer>

    <script src="assets/js/main.js?v=5"></script>
</body>
</html>
