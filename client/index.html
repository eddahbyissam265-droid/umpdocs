<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- BALISE VITALE POUR LE RESPONSIVE MOBILE -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMPDocs - Vos cours et documents en ligne</title>
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

    <!-- Barre de navigation -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html">📚 UMPDocs</a>
        </div>
        <nav class="nav-links">
            <a href="index.html" class="active">Accueil</a>
            <a href="admin.html">Espace Admin</a>
        </nav>
    </header>

    <!-- Conteneur Principal -->
    <main class="main-container">

        <!-- Section Titre et Recherche -->
        <section class="hero-section">
            <h1>Bienvenue sur UMPDocs</h1>
            <p>Accédez facilement à vos cours, TD et examens récents.</p>
            
            <!-- Barre de Recherche -->
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Rechercher un cours, TD, matière...">
                <button id="searchBtn">Rechercher</button>
            </div>
        </section>

        <!-- Section Grille de Documents -->
        <section class="documents-section">
            <h2>Documents Disponibles</h2>
            <!-- ZONE DE RECHERCHE ET FILTRES -->
<div class="recherche-container" style="margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
    
    <!-- Barre de texte -->
    <input type="text" id="barreRecherche" placeholder="Chercher un module, un titre..." style="padding: 8px; flex: 1; min-width: 200px;">
    
    <!-- Filtre Filière -->
    <!-- Filtre Filière -->
<select id="filtreFiliere" style="padding: 8px;">
    <option value="">Toutes les filières</option>
    <option value="SMA">MIP-MATH</option>
    <option value="SMI">MIP-INFO</option>
    <option value="SMP">PC-PHYSIQUE</option>
    <option value="SMC">PC-CHIMIE</option>
    <option value="IA">IA</option>   <!-- 👈 Nouvelle filière IA -->
    <option value="BCG">BCG</option> <!-- 👈 Nouvelle filière BCG -->
    <option value="Général">Général</option>
</select>
    
    <!-- Filtre Semestre -->
    <select id="filtreSemestre" style="padding: 8px;">
        <option value="">Tous les semestres</option>
        <option value="S1">S1</option>
        <option value="S2">S2</option>
        <option value="S3">S3</option>
        <option value="S4">S4</option>
        <option value="S5">S5</option>
        <option value="S6">S6</option>
    </select>

    <!-- Filtre Catégorie -->
    <select id="filtreCategorie" style="padding: 8px;">
        <option value="">Toutes les catégories</option>
        <option value="Cours">Cours</option>
        <option value="TD">TD</option>
        <option value="Examens">Examens</option>
    </select>

</div>
            <div id="documents-container" class="documents-grid">
                <!-- Les cartes de documents seront ajoutées dynamiquement ici par main.js -->
            </div>
        </section>

    </main>

    <!-- Pied de page -->
    <footer>
        <p>&copy; 2026 UMPDocs - Tous droits réservés</p>
    </footer>

    <script src="assets/js/main.js?v=5"></script>
</body>
</html>
